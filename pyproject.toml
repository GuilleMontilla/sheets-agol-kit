[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sheets-agol-kit"
description = "Pipeline reusable: Google Sheets -> geocoding (Nominatim) -> capa CSV / Web Map en ArcGIS Online"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Guillermo Montilla" }]
keywords = [
    "google-sheets",
    "geocoding",
    "nominatim",
    "arcgis",
    "arcgis-online",
    "webmap",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Typing :: Typed",
]
dependencies = [
    "gspread>=6.1",
    "requests>=2.32",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/GuilleMontilla/sheets-agol-kit"
Repository = "https://github.com/GuilleMontilla/sheets-agol-kit"
Issues = "https://github.com/GuilleMontilla/sheets-agol-kit/issues"
Changelog = "https://github.com/GuilleMontilla/sheets-agol-kit/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Solo necesario para crear el Web Map en AGOL (webmap.create_webmap)
agol = ["arcgis>=2.4"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sheets_agol_kit = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "sheets_agol_kit.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["sheets_agol_kit"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
ignore_missing_imports = true
